<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUマーケット｜申込中の商品</title>
  <style>
    :root {
      --fill: #d9d9d9;
      --text: #1a1a1a;
      --muted: #767676;
      --line: #d0d0d0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic",
        "Noto Sans JP", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100%;
      padding: 20px 20px 48px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .back {
      padding: 6px 2px;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }

    .back:hover {
      text-decoration: underline;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      padding: 16px;
      border: 1px solid var(--line);
      background: #ffffff;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }

    .card:hover {
      background: #fafafa;
    }

    .card .thumb {
      flex: 0 0 auto;
      width: 40%;
      aspect-ratio: 1 / 1;
      background: var(--fill);
      overflow: hidden;
    }

    .card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card .body {
      display: flex;
      flex-direction: column;
      gap: 18px;
      font-size: 12px;
      line-height: 1.4;
    }

    .card .status {
      color: var(--muted);
    }

    .empty {
      margin: 0;
      font-size: 12px;
      line-height: 1.8;
      color: var(--muted);
    }

    .empty a {
      color: var(--text);
    }

    .empty[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="header">
      <button type="button" class="back" id="back">←</button>
      <h1>申込中の商品</h1>
    </div>

    <div class="list" id="list"></div>
    <p class="empty" id="empty" hidden>
      申込中の商品はありません。<br>
      <a href="search.html">検索画面から商品を探す</a>
    </p>
  </main>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "applications";

      var back = document.getElementById("back");
      var list = document.getElementById("list");
      var empty = document.getElementById("empty");

      back.addEventListener("click", function () {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = "mypage.html";
      });

      // 申込APIはまだ繋いでいないため、申込確認画面がこの端末に保存した内容を読む。
      function loadApplications() {
        try {
          return JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "[]");
        } catch (error) {
          return [];
        }
      }

      function formatDate(value) {
        var date = new Date(value);
        if (isNaN(date.getTime())) return "";
        return date.getFullYear() + "年" + (date.getMonth() + 1) + "月" + date.getDate() + "日";
      }

      function createCard(application) {
        var card = document.createElement("button");
        card.type = "button";
        card.className = "card";

        var thumb = document.createElement("span");
        thumb.className = "thumb";
        if (application.photo) {
          var image = document.createElement("img");
          image.src = application.photo;
          image.alt = "";
          thumb.appendChild(image);
        }

        var body = document.createElement("span");
        body.className = "body";

        var name = document.createElement("span");
        name.textContent = application.name;

        var applied = document.createElement("span");
        applied.textContent = "申込日　" + formatDate(application.appliedAt);

        var status = document.createElement("span");
        status.className = "status";
        status.textContent = "状態　" + (application.status || "申込中");

        body.appendChild(name);
        body.appendChild(applied);
        body.appendChild(status);
        card.appendChild(thumb);
        card.appendChild(body);

        card.addEventListener("click", function () {
          window.location.href = "detail.html?id=" + encodeURIComponent(application.id);
        });

        return card;
      }

      function render() {
        var applications = loadApplications();

        list.textContent = "";
        applications.slice().reverse().forEach(function (application) {
          list.appendChild(createCard(application));
        });

        list.hidden = applications.length === 0;
        empty.hidden = applications.length > 0;
      }

      render();
    })();
  </script>
</body>
</html>
