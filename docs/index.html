<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUマーケット｜ログイン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <header class="brand">
      <p class="brand-name">YUマーケット</p>
      <p class="brand-sub">山口大学</p>
    </header>

    <form class="login-form" id="login-form" novalidate>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" autocomplete="email" inputmode="email">
        <p class="error" id="email-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <p class="error" id="password-error" role="alert"></p>
      </div>

      <div class="actions">
        <button type="submit" class="submit">ログイン</button>
        <a class="signup-link" href="signup.html">初めて利用する方はこちら</a>
      </div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
