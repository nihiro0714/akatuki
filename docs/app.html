<title>YUマーケット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
  :root {
    --fill: #d9d9d9;
    --fill-hover: #cccccc;
    --panel: #f4f4f4;
    --panel-hover: #e6e6e6;
    --text: #1a1a1a;
    --muted: #767676;
    --line: #d0d0d0;
    --error: #c0392b;
    --ok: #1a7f43;
    --nav-height: 56px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    background: #ffffff;
    color: var(--text);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans",
      "Yu Gothic", Meiryo, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button,
  input,
  select,
  textarea {
    font-family: inherit;
    color: var(--text);
  }

  :focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }

  .view {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    padding: 20px 20px 48px;
  }

  .view[hidden] {
    display: none;
  }

  .view.with-tabs {
    padding-bottom: calc(var(--nav-height) + 32px);
  }

  /* 共通の見出し・ボタン */
  .screen-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .screen-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.04em;
  }

  .screen-head .spacer {
    margin-left: auto;
  }

  .linkish {
    padding: 6px 2px;
    border: none;
    background: none;
    font-size: 13px;
    cursor: pointer;
  }

  .linkish:hover {
    text-decoration: underline;
  }

  .block-button {
    width: 180px;
    height: 52px;
    border: none;
    background: var(--fill);
    font-size: 14px;
    letter-spacing: 0.06em;
    cursor: pointer;
  }

  .block-button:hover {
    background: var(--fill-hover);
  }

  .block-button:disabled {
    color: var(--muted);
    cursor: default;
  }

  .block-button.secondary {
    background: var(--panel);
  }

  .block-button.secondary:hover {
    background: var(--panel-hover);
  }

  .actions {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  .actions[hidden] {
    display: none;
  }

  .error {
    margin: 4px 0 0;
    min-height: 16px;
    font-size: 12px;
    line-height: 16px;
    color: var(--error);
  }

  .note {
    margin: 14px 0 0;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    text-align: center;
  }

  .note[hidden] {
    display: none;
  }

  .note a {
    color: var(--text);
  }

  .invalid {
    border-color: var(--error) !important;
  }

  /* ログイン・新規登録 */
  .brand {
    margin: 36px 0;
    text-align: center;
  }

  .brand-name {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0.08em;
  }

  .brand-sub {
    margin: 6px 0 0;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .auth-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .auth-field label {
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  .auth-field input {
    height: 60px;
    padding: 0 12px;
    border: 1px solid transparent;
    background: var(--fill);
    font-size: 16px;
  }

  .auth-actions {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .auth-actions .block-button {
    width: 130px;
    height: 44px;
  }

  .auth-switch {
    border: none;
    background: none;
    font-size: 13px;
    cursor: pointer;
  }

  .auth-switch:hover {
    text-decoration: underline;
  }

  .auth-message {
    margin: 0;
    min-height: 16px;
    font-size: 12px;
    color: var(--ok);
    text-align: center;
  }

  /* サイト名 */
  .sitebar {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
  }

  .sitebar-name {
    font-size: 15px;
    letter-spacing: 0.08em;
  }

  .sitebar-sub {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  /* 検索欄 */
  .search-input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border: 1px solid transparent;
    background: var(--fill);
    font-size: 14px;
  }

  .search-input::placeholder {
    color: #6b6b6b;
  }

  /* チェックボックス共通 */
  .choice {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }

  .choice input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .choice .box {
    width: 14px;
    height: 14px;
    background: var(--fill);
    border: 1px solid transparent;
  }

  .choice input:checked + .box {
    background: #8a8a8a;
  }

  .choice input:focus-visible + .box {
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }

  .categories {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin: 18px 0 0;
    padding: 0;
    border: none;
  }

  /* 商品グリッド */
  .section {
    margin-top: 26px;
  }

  .section h2 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.04em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px 18px;
  }

  .card {
    display: block;
    padding: 0;
    border: none;
    background: none;
    text-align: left;
    cursor: pointer;
  }

  .card .thumb {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--fill);
  }

  .card:hover .thumb {
    background: var(--fill-hover);
  }

  .card .name {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    line-height: 1.4;
  }

  .empty {
    margin: 12px 0 0;
    font-size: 12px;
    line-height: 1.8;
    color: var(--muted);
  }

  .empty[hidden] {
    display: none;
  }

  /* 絞り込み */
  .filters {
    margin-top: 20px;
  }

  .filter {
    margin-bottom: 10px;
  }

  .filter-toggle {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 2px 0;
    border: none;
    background: none;
    font-size: 13px;
    cursor: pointer;
  }

  .filter-toggle .arrow {
    font-size: 10px;
    transition: transform 0.15s;
  }

  .filter-toggle[aria-expanded="true"] .arrow {
    transform: rotate(180deg);
  }

  .filter-toggle .count {
    font-size: 11px;
    color: var(--muted);
  }

  .filter-panel {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--panel);
  }

  .filter-panel[hidden] {
    display: none;
  }

  .reset {
    padding: 0;
    border: none;
    background: none;
    font-size: 12px;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
  }

  .reset[hidden] {
    display: none;
  }

  /* 商品詳細 */
  .photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--fill);
    overflow: hidden;
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo.narrow {
    width: 72%;
    margin: 0 auto;
  }

  .description {
    margin-top: 26px;
  }

  .description h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.04em;
  }

  .description-body {
    margin: 12px 0 0;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-line;
  }

  .description-body[hidden],
  .description-input[hidden] {
    display: none;
  }

  .description-input {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 8px 10px;
    border: 1px solid transparent;
    background: var(--panel);
    font-size: 12px;
    line-height: 1.7;
    resize: vertical;
  }

  .specs {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .spec {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 38px;
    padding: 8px 12px;
    background: var(--fill);
    font-size: 12px;
  }

  .spec .label {
    white-space: nowrap;
    letter-spacing: 0.04em;
  }

  .spec .value {
    text-align: right;
  }

  .spec .value[hidden],
  .spec select[hidden] {
    display: none;
  }

  .spec select {
    max-width: 60%;
    padding: 4px 6px;
    border: 1px solid #8a8a8a;
    background: #ffffff;
    font-size: 12px;
  }

  /* 申込確認 */
  .boxed-field {
    padding: 12px 14px;
    background: var(--fill);
  }

  .boxed-field label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.04em;
  }

  .boxed-field input,
  .boxed-field select,
  .boxed-field textarea {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 6px 8px;
    border: 1px solid transparent;
    background: #ffffff;
    font-size: 13px;
  }

  .boxed-field textarea {
    line-height: 1.6;
    resize: vertical;
  }

  .form-stack {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .agree {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }

  .agree input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .agree .box {
    width: 14px;
    height: 14px;
    border: 1px solid var(--text);
    background: #ffffff;
  }

  .agree input:checked + .box {
    background: var(--text);
  }

  .agree input:focus-visible + .box {
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }

  .center-error {
    text-align: center;
  }

  /* 出品 */
  .photo-picker {
    display: block;
    width: 72%;
    margin: 0 auto;
    padding: 0;
    aspect-ratio: 1 / 1;
    border: none;
    background: var(--fill);
    font-size: 12px;
    cursor: pointer;
    overflow: hidden;
  }

  .photo-picker:hover {
    background: var(--fill-hover);
  }

  .photo-picker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo-remove {
    display: block;
    margin: 8px auto 0;
    padding: 0;
    border: none;
    background: none;
    font-size: 12px;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
  }

  .photo-remove[hidden] {
    display: none;
  }

  .caption {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    letter-spacing: 0.04em;
  }

  .plain-input,
  .plain-textarea {
    display: block;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid transparent;
    background: var(--fill);
    font-size: 13px;
    line-height: 1.6;
  }

  .plain-input {
    height: 44px;
  }

  .plain-textarea {
    resize: vertical;
  }

  .picker-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    min-height: 42px;
    padding: 10px 14px;
    border: 1px solid transparent;
    background: var(--fill);
    font-size: 12px;
    text-align: left;
    cursor: pointer;
  }

  .picker-toggle:hover {
    background: var(--fill-hover);
  }

  .picker-toggle .chosen {
    margin-left: auto;
    color: var(--muted);
  }

  .picker-toggle .mark {
    width: 12px;
    text-align: center;
    font-size: 14px;
  }

  .picker-panel {
    display: flex;
    flex-direction: column;
    margin-top: 6px;
    background: var(--panel);
  }

  .picker-panel[hidden] {
    display: none;
  }

  .picker-panel label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    font-size: 12px;
    cursor: pointer;
  }

  .picker-panel input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .picker-panel .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--fill);
  }

  .picker-panel input:checked + .dot {
    background: #6b6b6b;
  }

  .picker-panel input:focus-visible + .dot {
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }

  /* プロフィール */
  .profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .avatar {
    width: 128px;
    height: 128px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--fill);
    font-size: 12px;
    overflow: hidden;
  }

  .avatar.editable {
    cursor: pointer;
  }

  .avatar.editable:hover {
    background: var(--fill-hover);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .profile p {
    margin: 0;
    font-size: 12px;
    text-align: center;
  }

  .profile .profile-name {
    margin-top: 4px;
    font-size: 13px;
  }

  .profile .profile-university {
    color: var(--muted);
  }

  .profile-view[hidden],
  .profile-edit[hidden] {
    display: none;
  }

  .edit-chip {
    margin: 6px 0;
    padding: 4px 14px;
    border: none;
    background: var(--fill);
    font-size: 12px;
    cursor: pointer;
  }

  .edit-chip:hover {
    background: var(--fill-hover);
  }

  .profile-edit {
    width: 100%;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .profile-edit label {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
  }

  .profile-edit input,
  .profile-edit select {
    display: block;
    width: 100%;
    height: 38px;
    padding: 0 10px;
    border: 1px solid transparent;
    background: var(--fill);
    font-size: 13px;
  }

  .menu {
    margin-top: 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .menu-item {
    width: 100%;
    min-height: 46px;
    padding: 12px 14px;
    border: none;
    background: var(--fill);
    font-size: 13px;
    cursor: pointer;
  }

  .menu-item:hover {
    background: var(--fill-hover);
  }

  .menu-item .badge {
    margin-left: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .menu-panel {
    margin-top: -6px;
    padding: 12px 14px;
    background: var(--panel);
    font-size: 12px;
    line-height: 1.7;
  }

  .menu-panel[hidden] {
    display: none;
  }

  .listing {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid #e2e2e2;
  }

  .listing:last-child {
    border-bottom: none;
  }

  .listing .thumb {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    background: var(--fill);
    overflow: hidden;
  }

  .listing .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .listing .meta {
    color: var(--muted);
  }

  /* 申込中の商品 */
  .app-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .app-card {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
    padding: 16px;
    border: 1px solid var(--line);
    background: #ffffff;
    text-align: left;
    cursor: pointer;
  }

  .app-card:hover {
    background: #fafafa;
  }

  .app-card .thumb {
    flex: 0 0 auto;
    width: 40%;
    aspect-ratio: 1 / 1;
    background: var(--fill);
    overflow: hidden;
  }

  .app-card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .app-card .body {
    display: flex;
    flex-direction: column;
    gap: 18px;
    font-size: 12px;
    line-height: 1.4;
  }

  .app-card .status {
    color: var(--muted);
  }

  /* 下部タブ */
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--nav-height);
    max-width: 480px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: #ffffff;
    border-top: 1px solid var(--line);
  }

  .tabbar[hidden] {
    display: none;
  }

  .tab {
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-left: 1px solid var(--line);
    background: none;
    font-size: 12px;
    cursor: pointer;
  }

  .tab:first-child {
    border-left: none;
  }

  .tab[aria-current="page"] {
    background: var(--fill);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--nav-height) + 16px);
    transform: translateX(-50%);
    padding: 8px 14px;
    background: rgba(26, 26, 26, 0.85);
    color: #ffffff;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .toast.show {
    opacity: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>

<!-- ログイン -->
<main class="view" id="view-login" hidden>
  <header class="brand">
    <p class="brand-name">YUマーケット</p>
    <p class="brand-sub">山口大学</p>
  </header>

  <form class="auth-form" id="login-form" novalidate>
    <div class="auth-field">
      <label for="login-email">メールアドレス</label>
      <input type="email" id="login-email" autocomplete="email" inputmode="email">
      <p class="error" id="login-email-error" role="alert"></p>
    </div>

    <div class="auth-field">
      <label for="login-password">パスワード</label>
      <input type="password" id="login-password" autocomplete="current-password">
      <p class="error" id="login-password-error" role="alert"></p>
    </div>

    <div class="auth-actions">
      <button type="submit" class="block-button">ログイン</button>
      <button type="button" class="auth-switch" id="to-signup">初めて利用する方はこちら</button>
    </div>
  </form>
</main>

<!-- 新規登録 -->
<main class="view" id="view-signup" hidden>
  <header class="brand">
    <p class="brand-name">YUマーケット</p>
    <p class="brand-sub">山口大学</p>
  </header>

  <form class="auth-form" id="signup-form" novalidate>
    <div class="auth-field">
      <label for="signup-email">メールアドレス</label>
      <input type="email" id="signup-email" autocomplete="email" inputmode="email">
      <p class="error" id="signup-email-error" role="alert"></p>
    </div>

    <div class="auth-field">
      <label for="signup-password">パスワード</label>
      <input type="password" id="signup-password" autocomplete="new-password">
      <p class="error" id="signup-password-error" role="alert"></p>
    </div>

    <div class="auth-field">
      <label for="signup-confirm">パスワード（確認）</label>
      <input type="password" id="signup-confirm" autocomplete="new-password">
      <p class="error" id="signup-confirm-error" role="alert"></p>
    </div>

    <div class="auth-actions">
      <button type="submit" class="block-button">登録する</button>
      <p class="auth-message" id="signup-message" role="status"></p>
      <button type="button" class="auth-switch" id="to-login">すでに登録済みの方はこちら</button>
    </div>
  </form>
</main>

<!-- ホーム -->
<main class="view with-tabs" id="view-home" hidden>
  <header class="sitebar">
    <span class="sitebar-name">YUマーケット</span>
    <span class="sitebar-sub">山口大学</span>
  </header>

  <input type="search" id="home-search" class="search-input" placeholder="検索" autocomplete="off" aria-label="商品を検索">

  <fieldset class="categories" id="home-categories"></fieldset>

  <section class="section">
    <h2>あなたへのおすすめ</h2>
    <div class="grid" id="home-recommended"></div>
    <p class="empty" id="home-recommended-empty" hidden>条件に合う商品がありません</p>
  </section>

  <section class="section">

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------

     この端末のブラウザ（localStorage）に保存している。
     公開時は必ずサーバー側に置き換えること。
  ------------------------------------------------------------------ */
  var OPTIONS = {
    category: ["家具", "家電", "教科書", "その他"],
    condition: ["未使用に近い", "目立った傷なし", "やや傷や汚れあり", "傷や汚れあり", "書き込みあり"],

  var PRODUCTS = [
    { id: 1, name: "木製ローテーブル", category: "家具", condition: "目立った傷なし", pickup: "大学構内", period: "今週中", campus: "吉田", recommended: true, createdAt: "2026-09-04", description: "組み立て済み\n使用期間　1年" },

    { id: 3, name: "微分積分学 教科書", category: "教科書", condition: "書き込みあり", pickup: "大学構内", period: "今週中", campus: "吉田", recommended: false, createdAt: "2026-09-06", description: "第3版\n使用期間　1年" },
    { id: 4, name: "電子レンジ", category: "家電", condition: "目立った傷なし", pickup: "最寄り駅", period: "今月中", campus: "吉田", recommended: false, createdAt: "2026-09-06", description: "動作確認済み\n使用期間　2年" },
    { id: 5, name: "カラーボックス 3段", category: "家具", condition: "やや傷や汚れあり", pickup: "大学構内", period: "今月中", campus: "常盤", recommended: false, createdAt: "2026-09-05", description: "背板に小さな傷あり\n使用期間　3年" },
    { id: 6, name: "自転車用 空気入れ", category: "その他", condition: "目立った傷なし", pickup: "最寄り駅", period: "相談可", campus: "小串", recommended: false, createdAt: "2026-09-05", description: "動作確認済み\n使用期間　1年" },
    { id: 7, name: "統計学入門 教科書", category: "教科書", condition: "未使用に近い", pickup: "配送", period: "今月中", campus: "常盤", recommended: true, createdAt: "2026-09-01", description: "書き込みなし\n使用期間　半年" },
    { id: 8, name: "デスクライト", category: "その他", condition: "目立った傷なし", pickup: "大学構内", period: "今週中", campus: "吉田", recommended: false, createdAt: "2026-09-02", description: "動作確認済み\n使用期間　2年" },
    { id: 9, name: "折りたたみ椅子", category: "家具", condition: "やや傷や汚れあり", pickup: "最寄り駅", period: "相談可", campus: "吉田", recommended: false, createdAt: "2026-09-04", description: "座面に汚れあり\n使用期間　2年" },
    { id: 10, name: "ケトル", category: "家電", condition: "目立った傷なし", pickup: "大学構内", period: "今週中", campus: "小串", recommended: false, createdAt: "2026-09-03", description: "動作確認済み\n使用期間　1年" },
    { id: 11, name: "英語リーディング 教科書", category: "教科書", condition: "書き込みあり", pickup: "最寄り駅", period: "今月中", campus: "常盤", recommended: false, createdAt: "2026-09-02", description: "蛍光ペンでの書き込みあり\n使用期間　1年" },
    { id: 12, name: "衣類スタンド", category: "家具", condition: "未使用に近い", pickup: "配送", period: "相談可", campus: "吉田", recommended: true, createdAt: "2026-09-01", description: "組み立て説明書あり\n使用期間　半年" }
  ];

  var MAX_PHOTO_BYTES = 5 * 1024 * 1024;

  /* ------------------------------------------------------------------
     共通ヘルパー
  ------------------------------------------------------------------ */
  function $(id) {
    return document.getElementById(id);
  }

  function each(list, callback) {
    Array.prototype.forEach.call(list, callback);
  }

  function read(key, fallback) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (error) {
      return fallback;
    }
  }

  function write(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (error) {
      return false;
    }
  }

  function setError(element, output, text) {
    if (output) output.textContent = text;
    if (element) element.classList.toggle("invalid", Boolean(text));
    return !text;
  }

  function go(hash) {
    window.location.hash = hash;
  }

  var toast = $("toast");
  var toastTimer = null;

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add("show");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      toast.classList.remove("show");
    }, 1800);
  }

  function productById(id) {
    return PRODUCTS.filter(function (item) {
      return item.id === Number(id);
    })[0];
  }

  function editedProduct(id) {
    var edits = read("product-edits", {});
    return Object.assign({}, productById(id), edits[id] || {});
  }

  function formatDate(value) {
    var date = new Date(value);
    if (isNaN(date.getTime())) return "";
    return date.getFullYear() + "年" + (date.getMonth() + 1) + "月" + date.getDate() + "日";
  }

  function makeCard(item) {
    var card = document.createElement("button");
    card.type = "button";
    card.className = "card";

    var thumb = document.createElement("span");
    thumb.className = "thumb";

    var name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;

    card.appendChild(thumb);
    card.appendChild(name);
    card.addEventListener("click", function () {
      go("#/detail/" + item.id);
    });

    return card;
  }

  function readPhoto(file, onDone, onError) {
    if (file.size > MAX_PHOTO_BYTES) {
      onError("写真は5MB以内のファイルを選んでください");
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      onDone(String(reader.result));
    };
    reader.onerror = function () {
      onError("写真を読み込めませんでした");
    };
    reader.readAsDataURL(file);
  }

  /* ------------------------------------------------------------------
     ログイン・新規登録
  ------------------------------------------------------------------ */
  var EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  (function login() {
    var form = $("login-form");
    var email = $("login-email");
    var password = $("login-password");
    var emailError = $("login-email-error");
    var passwordError = $("login-password-error");

    function validateEmail() {
      var value = email.value.trim();
      if (!value) return setError(email, emailError, "メールアドレスを入力してください");
      if (!EMAIL_PATTERN.test(value)) return setError(email, emailError, "メールアドレスの形式が正しくありません");
      return setError(email, emailError, "");
    }

    function validatePassword() {
      if (!password.value) return setError(password, passwordError, "パスワードを入力してください");
      if (password.value.length < 8) return setError(password, passwordError, "パスワードは8文字以上で入力してください");
      return setError(password, passwordError, "");
    }

    email.addEventListener("blur", validateEmail);
    password.addEventListener("blur", validatePassword);

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var okEmail = validateEmail();
      var okPassword = validatePassword();
      if (!okEmail || !okPassword) {
        (okEmail ? password : email).focus();
        return;
      }

      var accounts = read("accounts", []);
      var address = email.value.trim();

      // 登録がまだ無い場合は、動作確認のためそのまま通す。
      if (accounts.length > 0) {
        var matched = accounts.filter(function (account) {
          return account.email === address && account.password === password.value;
        })[0];
        if (!matched) {
          setError(password, passwordError, "メールアドレスまたはパスワードが正しくありません");
          password.focus();
          return;
        }
      }

      write("session", { email: address });
      go("#/home");
    });

    $("to-signup").addEventListener("click", function () {
      go("#/signup");
    });
  })();

  (function signup() {
    var form = $("signup-form");
    var email = $("signup-email");
    var password = $("signup-password");
    var confirmInput = $("signup-confirm");
    var emailError = $("signup-email-error");
    var passwordError = $("signup-password-error");
    var confirmError = $("signup-confirm-error");
    var message = $("signup-message");

    function validateEmail() {
      var value = email.value.trim();
      if (!value) return setError(email, emailError, "メールアドレスを入力してください");
      if (!EMAIL_PATTERN.test(value)) return setError(email, emailError, "メールアドレスの形式が正しくありません");
      return setError(email, emailError, "");
    }

    function validatePassword() {
      if (!password.value) return setError(password, passwordError, "パスワードを入力してください");
      if (password.value.length < 8) return setError(password, passwordError, "パスワードは8文字以上で入力してください");
      return setError(password, passwordError, "");
    }

    function validateConfirm() {
      if (!confirmInput.value) return setError(confirmInput, confirmError, "確認用パスワードを入力してください");
      if (confirmInput.value !== password.value) return setError(confirmInput, confirmError, "パスワードが一致しません");
      return setError(confirmInput, confirmError, "");
    }

    email.addEventListener("blur", validateEmail);
    password.addEventListener("blur", validatePassword);
    confirmInput.addEventListener("blur", validateConfirm);

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      message.textContent = "";

      var checks = [validateEmail(), validatePassword(), validateConfirm()];
      var inputs = [email, password, confirmInput];
      var firstNg = checks.indexOf(false);
      if (firstNg !== -1) {
        inputs[firstNg].focus();
        return;
      }

      var accounts = read("accounts", []);
      var address = email.value.trim();

      if (accounts.some(function (account) { return account.email === address; })) {
        setError(email, emailError, "このメールアドレスは既に登録されています");
        email.focus();
        return;
      }

      accounts.push({ email: address, password: password.value });
      if (!write("accounts", accounts)) {
        message.textContent = "登録内容を保存できませんでした。";
        return;
      }
      write("session", { email: address });

      message.textContent = "登録しました。ホーム画面に移動します。";
      window.setTimeout(function () {
        go("#/home");
      }, 600);
    });

    $("to-login").addEventListener("click", function () {
      go("#/login");
    });
  })();

    OPTIONS.category.forEach(function (value) {

      label.className = "choice";

      input.type = "checkbox";
      input.value = value;
      var box = document.createElement("span");

      box.setAttribute("aria-hidden", "true");
      label.appendChild(input);
      label.appendChild(box);
      label.appendChild(document.createTextNode(value));
      categories.appendChild(label);
    });

    function visible() {
      var keyword = search.value.trim().toLowerCase();
      var picked = [];
      each(categories.querySelectorAll("input:checked"), function (input) {
        picked.push(input.value);
      });

      return PRODUCTS.filter(function (item) {
        var matchesKeyword = !keyword ||
          item.name.toLowerCase().indexOf(keyword) !== -1 ||
          item.category.toLowerCase().indexOf(keyword) !== -1;
        var matchesCategory = picked.length === 0 || picked.indexOf(item.category) !== -1;
        return matchesKeyword && matchesCategory;
      });
    }

    function fill(grid, empty, items) {
      grid.textContent = "";
      items.forEach(function (item) {
        grid.appendChild(makeCard(item));
      });
      grid.hidden = items.length === 0;
      empty.hidden = items.length > 0;
    }

    function render() {
      var items = visible();

      fill(recommended, recommendedEmpty, items.filter(function (item) {
        return item.recommended;
      }).slice(0, 4));

      fill(latest, latestEmpty, items.slice().sort(function (a, b) {
        return a.createdAt < b.createdAt ? 1 : a.createdAt > b.createdAt ? -1 : b.id - a.id;
      }).slice(0, 6));
    }

    search.addEventListener("input", render);
    categories.addEventListener("change", render);

    return { render: render, keyword: function () { return search.value.trim(); } };
  })();

  var searchView = (function () {
    var input = $("search-input");
    var filters = $("search-filters");
    var results = $("search-results");
    var empty = $("search-empty");
    var reset = $("search-reset");
    var keys = ["category", "pickup", "period", "campus"];

    each(filters.querySelectorAll(".filter"), function (filter) {
      var key = filter.dataset.key;
      var panel = filter.querySelector(".filter-panel");

      OPTIONS[key].forEach(function (value) {
        var label = document.createElement("label");
        label.className = "choice";
        var box = document.createElement("input");
        box.type = "checkbox";
        box.value = value;
        box.dataset.key = key;
        var mark = document.createElement("span");
        mark.className = "box";
        mark.setAttribute("aria-hidden", "true");
        label.appendChild(box);
        label.appendChild(mark);
        label.appendChild(document.createTextNode(value));
        panel.appendChild(label);
      });
    });

    function selected(key) {
      var values = [];
      each(filters.querySelectorAll('input[data-key="' + key + '"]:checked'), function (input) {
        values.push(input.value);
      });
      return values;
    }

    function updateCounts() {
      var total = 0;
      each(filters.querySelectorAll(".filter"), function (filter) {
        var picked = selected(filter.dataset.key);
        total += picked.length;
        filter.querySelector(".count").textContent = picked.length ? "（" + picked.length + "）" : "";
      });
      reset.hidden = total === 0;
    }

    function render() {
      var keyword = input.value.trim().toLowerCase();
      var picked = {};
      keys.forEach(function (key) {
        picked[key] = selected(key);
      });

      var items = PRODUCTS.filter(function (item) {
        if (keyword &&
            item.name.toLowerCase().indexOf(keyword) === -1 &&
            item.category.toLowerCase().indexOf(keyword) === -1) {
          return false;
        }
        return keys.every(function (key) {
          return picked[key].length === 0 || picked[key].indexOf(item[key]) !== -1;
        });
      });

      results.textContent = "";
      items.forEach(function (item) {
        results.appendChild(makeCard(item));
      });
      results.hidden = items.length === 0;
      empty.hidden = items.length > 0;
      updateCounts();
    }

    filters.addEventListener("click", function (event) {
      var toggle = event.target.closest(".filter-toggle");
      if (!toggle) return;
      var panel = $(toggle.getAttribute("aria-controls"));
      var open = toggle.getAttribute("aria-expanded") === "true";
      toggle.setAttribute("aria-expanded", String(!open));
      panel.hidden = open;
    });

    filters.addEventListener("change", render);
    input.addEventListener("input", render);

    reset.addEventListener("click", function () {
      each(filters.querySelectorAll("input"), function (box) {
        box.checked = false;
      });
      render();
    });

    return {
      render: render,
      setKeyword: function (value) {
        if (typeof value === "string") input.value = value;
      }
    };
  })();

        meta.className = "meta";
        meta.textContent = [listing.category, listing.condition, listing.place].filter(Boolean).join("　");

        body.appendChild(title);
        body.appendChild(meta);
        row.appendChild(thumb);
        row.appendChild(body);
        panel.appendChild(row);
      });
    }

    each(document.querySelectorAll(".menu-item"), function (item) {
      item.addEventListener("click", function () {
        if (item.dataset.key === "applications") {
          go("#/applications");
          return;
        }
        var panel = $(item.getAttribute("aria-controls"));
        var open = item.getAttribute("aria-expanded") === "true";
        item.setAttribute("aria-expanded", String(!open));
        panel.hidden = open;
        if (!open && item.dataset.key === "listings") renderListings();
      });
    });

    return {
      render: function () {
        note.hidden = true;
        renderProfile();
        renderListings();
        setEditing(false);
        var applications = read("applications", []);
        $("mypage-applications-badge").textContent =
          applications.length ? "（" + applications.length + "）" : "";
      }
    };
  })();

  /* ------------------------------------------------------------------
     申込中の商品
  ------------------------------------------------------------------ */
  var applicationsView = (function () {
    var list = $("applications-list");
    var empty = $("applications-empty");

    $("applications-to-search").addEventListener("click", function () {
      go("#/search");
    });

    function card(application) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "app-card";

      var thumb = document.createElement("span");
      thumb.className = "thumb";

      var body = document.createElement("span");
      body.className = "body";

      var name = document.createElement("span");
      name.textContent = application.name;

      var applied = document.createElement("span");
      applied.textContent = "申込日　" + formatDate(application.appliedAt);

      var status = document.createElement("span");
      status.className = "status";
      status.textContent = "状態　" + (application.status || "申込中");

      body.appendChild(name);
      body.appendChild(applied);
      body.appendChild(status);
      button.appendChild(thumb);
      button.appendChild(body);

      button.addEventListener("click", function () {
        go("#/detail/" + application.id);
      });

      return button;
    }

    return {
      render: function () {
        var applications = read("applications", []);
        list.textContent = "";
        applications.slice().reverse().forEach(function (application) {
          list.appendChild(card(application));
        });
        list.hidden = applications.length === 0;
        empty.hidden = applications.length > 0;
      }
    };
  })();

  /* ------------------------------------------------------------------
     画面の切り替え
  ------------------------------------------------------------------ */
  var VIEWS = ["login", "signup", "home", "search", "detail", "confirm", "sell", "mypage", "applications"];
  var TAB_VIEWS = { home: "home", search: "search" };
  var tabbar = $("tabbar");

  each(document.querySelectorAll("[data-back]"), function (button) {
    button.addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
        return;
      }
      go("#/home");
    });
  });

  each(document.querySelectorAll("[data-home]"), function (button) {
    button.addEventListener("click", function () {
      go("#/home");
    });
  });

  each(document.querySelectorAll(".tab"), function (tab) {
    tab.addEventListener("click", function () {
      var key = tab.dataset.tab;
      if (key === "deals") {
        showToast("取引画面は未実装です");
        return;
      }
      if (key === "search") {
        searchView.setKeyword(home.keyword());
      }
      go("#/" + key);
    });
  });

  function parseHash() {
    var raw = window.location.hash.replace(/^#\/?/, "");
    var segments = raw.split("/").filter(Boolean);
    return { name: segments[0] || "login", param: segments[1] || "" };
  }

  function route() {
    var parsed = parseHash();
    var name = VIEWS.indexOf(parsed.name) === -1 ? "login" : parsed.name;

    if (name === "detail" && !detail.open(parsed.param)) return;
    if (name === "confirm" && !confirmView.open(parsed.param)) return;
    if (name === "home") home.render();
    if (name === "search") searchView.render();
    if (name === "mypage") mypage.render();
    if (name === "applications") applicationsView.render();

    VIEWS.forEach(function (view) {
      $("view-" + view).hidden = view !== name;
    });

    tabbar.hidden = !TAB_VIEWS[name];
    each(document.querySelectorAll(".tab"), function (tab) {
      if (tab.dataset.tab === TAB_VIEWS[name]) {
        tab.setAttribute("aria-current", "page");
      } else {
        tab.removeAttribute("aria-current");
      }
    });

    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", route);

  if (!window.location.hash) {
    go("#/login");
  } else {
    route();
  }
})();
</script>
