<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUマーケット｜検索</title>
  <style>
    :root {
      --fill: #d9d9d9;
      --fill-hover: #cccccc;
      --text: #1a1a1a;
      --muted: #767676;
      --line: #d0d0d0;
      --nav-height: 56px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic",
        "Noto Sans JP", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100%;
      padding: 28px 20px calc(var(--nav-height) + 32px);
    }

    /* サイト名 */
    .sitebar {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
    }

    .sitebar-name {
      font-size: 15px;
      letter-spacing: 0.08em;
    }

    .sitebar-sub {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* 検索 */
    .search {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 0;
      background: var(--fill);
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
    }

    .search::placeholder {
      color: #6b6b6b;
    }

    .search:focus {
      outline: none;
      border-color: #8a8a8a;
    }

    /* 絞り込み */
    .filters {
      margin: 20px 0 0;
    }

    .filter {
      margin-bottom: 10px;
    }

    .filter-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 2px 0;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }

    .filter-toggle .arrow {
      font-size: 10px;
      transition: transform 0.15s;
    }

    .filter-toggle[aria-expanded="true"] .arrow {
      transform: rotate(180deg);
    }

    .filter-toggle .count {
      font-size: 11px;
      color: var(--muted);
    }

    .filter-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 8px 0 0;
      padding: 10px 12px;
      background: #f4f4f4;
    }

    .filter-panel[hidden] {
      display: none;
    }

    .option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .option input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .option .box {
      width: 14px;
      height: 14px;
      background: var(--fill);
      border: 1px solid transparent;
    }

    .option input:checked + .box {
      background: #8a8a8a;
    }

    .option input:focus-visible + .box {
      border-color: var(--text);
    }

    .reset {
      margin-top: 2px;
      padding: 0;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 12px;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
    }

    .reset[hidden] {
      display: none;
    }

    /* 検索結果 */
    .results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 18px;
      margin-top: 18px;
    }

    .card {
      display: block;
      padding: 0;
      border: none;
      background: none;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }

    .card .thumb {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--fill);
    }

    .card:hover .thumb {
      background: var(--fill-hover);
    }

    .card .name {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.4;
    }

    .empty {
      margin: 18px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .empty[hidden] {
      display: none;
    }

    /* 下部タブ */
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--nav-height);
      max-width: 480px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: #ffffff;
      border-top: 1px solid var(--line);
    }

    .tab {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-left: 1px solid var(--line);
      background: none;
      font-family: inherit;
      font-size: 12px;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }

    .tab:first-child {
      border-left: none;
    }

    .tab[aria-current="page"] {
      background: var(--fill);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-height) + 16px);
      transform: translateX(-50%);
      padding: 8px 14px;
      background: rgba(26, 26, 26, 0.85);
      color: #ffffff;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="sitebar">
      <span class="sitebar-name">YUマーケット</span>
      <span class="sitebar-sub">山口大学</span>
    </header>

    <input type="search" id="search" class="search" placeholder="検索" autocomplete="off" aria-label="商品を検索">

    <div class="filters" id="filters">
      <div class="filter" data-key="category">
        <button type="button" class="filter-toggle" aria-expanded="false" aria-controls="panel-category">
          カテゴリー<span class="arrow" aria-hidden="true">▽</span><span class="count"></span>
        </button>
        <div class="filter-panel" id="panel-category" hidden></div>
      </div>

      <div class="filter" data-key="pickup">
        <button type="button" class="filter-toggle" aria-expanded="false" aria-controls="panel-pickup">
          受取場所<span class="arrow" aria-hidden="true">▽</span><span class="count"></span>
        </button>
        <div class="filter-panel" id="panel-pickup" hidden></div>
      </div>

      <div class="filter" data-key="period">
        <button type="button" class="filter-toggle" aria-expanded="false" aria-controls="panel-period">
          取引可能期間<span class="arrow" aria-hidden="true">▽</span><span class="count"></span>
        </button>
        <div class="filter-panel" id="panel-period" hidden></div>
      </div>

      <div class="filter" data-key="campus">
        <button type="button" class="filter-toggle" aria-expanded="false" aria-controls="panel-campus">
          キャンパス<span class="arrow" aria-hidden="true">▽</span><span class="count"></span>
        </button>
        <div class="filter-panel" id="panel-campus" hidden></div>
      </div>

      <button type="button" class="reset" id="reset" hidden>絞り込みを解除</button>
    </div>

    <div class="results" id="results"></div>
    <p class="empty" id="empty" hidden>条件に合う商品がありません</p>
  </main>

  <nav class="tabbar" aria-label="メインメニュー">
    <a class="tab" href="home.html">ホーム</a>
    <button type="button" class="tab" data-tab="search" aria-current="page">検索</button>
    <button type="button" class="tab" data-tab="sell">出品</button>
    <button type="button" class="tab" data-tab="deals">取引</button>
    <button type="button" class="tab" data-tab="mypage">マイページ</button>
  </nav>

  <div class="toast" id="toast" role="status"></div>

  <script>
    (function () {
      "use strict";

      var FILTERS = {
        category: ["家具", "家電", "教科書", "その他"],
        pickup: ["大学構内", "最寄り駅", "配送"],
        period: ["今週中", "今月中", "相談可"],
        campus: ["吉田", "常盤", "小串"]
      };

      // 商品APIはまだ繋いでいないため、ここをサーバーからの取得に差し替える。
      var PRODUCTS = [
        { id: 1, name: "木製ローテーブル", category: "家具", pickup: "大学構内", period: "今週中", campus: "吉田" },
        { id: 2, name: "一人暮らし用 冷蔵庫", category: "家電", pickup: "配送", period: "相談可", campus: "常盤" },
        { id: 3, name: "微分積分学 教科書", category: "教科書", pickup: "大学構内", period: "今週中", campus: "吉田" },
        { id: 4, name: "電子レンジ", category: "家電", pickup: "最寄り駅", period: "今月中", campus: "吉田" },
        { id: 5, name: "カラーボックス 3段", category: "家具", pickup: "大学構内", period: "今月中", campus: "常盤" },
        { id: 6, name: "自転車用 空気入れ", category: "その他", pickup: "最寄り駅", period: "相談可", campus: "小串" },
        { id: 7, name: "統計学入門 教科書", category: "教科書", pickup: "配送", period: "今月中", campus: "常盤" },
        { id: 8, name: "デスクライト", category: "その他", pickup: "大学構内", period: "今週中", campus: "吉田" },
        { id: 9, name: "折りたたみ椅子", category: "家具", pickup: "最寄り駅", period: "相談可", campus: "吉田" },
        { id: 10, name: "ケトル", category: "家電", pickup: "大学構内", period: "今週中", campus: "小串" },
        { id: 11, name: "英語リーディング 教科書", category: "教科書", pickup: "最寄り駅", period: "今月中", campus: "常盤" },
        { id: 12, name: "衣類スタンド", category: "家具", pickup: "配送", period: "相談可", campus: "吉田" }
      ];

      var search = document.getElementById("search");
      var filters = document.getElementById("filters");
      var results = document.getElementById("results");
      var empty = document.getElementById("empty");
      var reset = document.getElementById("reset");
      var toast = document.getElementById("toast");
      var toastTimer = null;

      function buildPanels() {
        Array.prototype.forEach.call(filters.querySelectorAll(".filter"), function (filter) {
          var key = filter.dataset.key;
          var panel = filter.querySelector(".filter-panel");

          FILTERS[key].forEach(function (value) {
            var label = document.createElement("label");
            label.className = "option";

            var input = document.createElement("input");
            input.type = "checkbox";
            input.value = value;
            input.dataset.key = key;

            var box = document.createElement("span");
            box.className = "box";
            box.setAttribute("aria-hidden", "true");

            label.appendChild(input);
            label.appendChild(box);
            label.appendChild(document.createTextNode(value));
            panel.appendChild(label);
          });
        });
      }

      function selectedValues(key) {
        return Array.prototype.map.call(
          filters.querySelectorAll('input[data-key="' + key + '"]:checked'),
          function (input) { return input.value; }
        );
      }

      function updateCounts() {
        var total = 0;

        Array.prototype.forEach.call(filters.querySelectorAll(".filter"), function (filter) {
          var picked = selectedValues(filter.dataset.key);
          total += picked.length;
          filter.querySelector(".count").textContent = picked.length ? "（" + picked.length + "）" : "";
        });

        reset.hidden = total === 0;
      }

      function visibleProducts() {
        var keyword = search.value.trim().toLowerCase();
        var picked = {};
        Object.keys(FILTERS).forEach(function (key) {
          picked[key] = selectedValues(key);
        });

        return PRODUCTS.filter(function (item) {
          if (keyword &&
              item.name.toLowerCase().indexOf(keyword) === -1 &&
              item.category.toLowerCase().indexOf(keyword) === -1) {
            return false;
          }
          return Object.keys(picked).every(function (key) {
            return picked[key].length === 0 || picked[key].indexOf(item[key]) !== -1;
          });
        });
      }

      function createCard(item) {
        var card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.dataset.id = String(item.id);

        var thumb = document.createElement("span");
        thumb.className = "thumb";

        var name = document.createElement("span");
        name.className = "name";
        name.textContent = item.name;

        card.appendChild(thumb);
        card.appendChild(name);

        card.addEventListener("click", function () {
          window.location.href = "detail.html?id=" + encodeURIComponent(item.id);
        });

        return card;
      }

      function render() {
        var items = visibleProducts();

        results.textContent = "";
        items.forEach(function (item) {
          results.appendChild(createCard(item));
        });

        results.hidden = items.length === 0;
        empty.hidden = items.length > 0;
        updateCounts();
      }

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toast.classList.remove("show");
        }, 1800);
      }

      filters.addEventListener("click", function (event) {
        var toggle = event.target.closest(".filter-toggle");
        if (!toggle) return;

        var panel = document.getElementById(toggle.getAttribute("aria-controls"));
        var open = toggle.getAttribute("aria-expanded") === "true";
        toggle.setAttribute("aria-expanded", String(!open));
        panel.hidden = open;
      });

      filters.addEventListener("change", render);

      reset.addEventListener("click", function () {
        Array.prototype.forEach.call(filters.querySelectorAll("input"), function (input) {
          input.checked = false;
        });
        render();
      });

      search.addEventListener("input", render);

      Array.prototype.forEach.call(document.querySelectorAll("button.tab"), function (tab) {
        tab.addEventListener("click", function () {
          if (tab.dataset.tab === "search") {
            search.focus();
            search.select();
            window.scrollTo({ top: 0, behavior: "smooth" });
            return;
          }
          if (tab.dataset.tab === "sell") {
            window.location.href = "sell.html";
            return;
          }
          if (tab.dataset.tab === "mypage") {
            window.location.href = "mypage.html";
            return;
          }
          showToast(tab.textContent + "画面は未実装です");
        });
      });

      buildPanels();

      // ホーム画面の検索タブから ?q=... で渡された検索語を引き継ぐ。
      var initialKeyword = new URLSearchParams(window.location.search).get("q");
      if (initialKeyword) {
        search.value = initialKeyword;
      }

      render();
    })();
  </script>
</body>
</html>
