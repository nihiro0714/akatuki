<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUマーケット｜プロフィール</title>
  <style>
    :root {
      --fill: #d9d9d9;
      --fill-hover: #cccccc;
      --text: #1a1a1a;
      --muted: #767676;
      --error: #c0392b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic",
        "Noto Sans JP", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100%;
      padding: 20px 20px 48px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .back {
      padding: 6px 2px;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }

    .back:hover {
      text-decoration: underline;
    }

    /* プロフィール */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .avatar {
      width: 128px;
      height: 128px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: var(--fill);
      font-family: inherit;
      font-size: 12px;
      color: var(--text);
      overflow: hidden;
    }

    .avatar.editable {
      cursor: pointer;
    }

    .avatar.editable:hover {
      background: var(--fill-hover);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      margin: 4px 0 0;
      font-size: 13px;
    }

    .profile-university,
    .profile-faculty,
    .profile-campus {
      margin: 0;
      font-size: 12px;
    }

    .profile-university {
      color: var(--muted);
    }

    .edit-button {
      padding: 4px 14px;
      border: none;
      border-radius: 0;
      background: var(--fill);
      font-family: inherit;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
    }

    .edit-button:hover {
      background: var(--fill-hover);
    }

    /* 編集フォーム */
    .edit-form {
      width: 100%;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .edit-form[hidden],
    .profile-view[hidden] {
      display: none;
    }

    .edit-field label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .edit-field input,
    .edit-field select {
      display: block;
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 0;
      background: var(--fill);
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
    }

    .edit-field input:focus,
    .edit-field select:focus {
      outline: none;
      border-color: #8a8a8a;
    }

    .edit-field .invalid {
      border-color: var(--error);
    }

    .error {
      margin: 4px 0 0;
      min-height: 16px;
      font-size: 12px;
      line-height: 16px;
      color: var(--error);
    }

    .edit-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .edit-actions button {
      width: 120px;
      height: 40px;
      border: none;
      border-radius: 0;
      background: var(--fill);
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }

    .edit-actions .secondary {
      background: #f0f0f0;
    }

    /* メニュー */
    .menu {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-item {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      border: none;
      background: var(--fill);
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }

    .menu-item:hover {
      background: var(--fill-hover);
    }

    .menu-item .badge {
      margin-left: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .menu-panel {
      margin-top: -6px;
      padding: 12px 14px;
      background: #f4f4f4;
      font-size: 12px;
      line-height: 1.7;
    }

    .menu-panel[hidden] {
      display: none;
    }

    .listing {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #e2e2e2;
    }

    .listing:last-child {
      border-bottom: none;
    }

    .listing .thumb {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      background: var(--fill);
      overflow: hidden;
    }

    .listing .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .listing .meta {
      color: var(--muted);
    }

    .note {
      margin: 14px 0 0;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
      text-align: center;
    }

    .note[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="header">
      <button type="button" class="back" id="back">←</button>
      <h1>プロフィール</h1>
    </div>

    <div class="profile">
      <button type="button" class="avatar" id="avatar" aria-label="プロフィール画像"></button>
      <input type="file" id="avatar-input" accept="image/*" hidden>

      <div class="profile-view" id="profile-view">
        <p class="profile-name" id="profile-name"></p>
        <div style="display:flex;justify-content:center;margin:6px 0;">
          <button type="button" class="edit-button" id="edit">プロフィールを編集</button>
        </div>
        <p class="profile-university">山口大学</p>
        <p class="profile-faculty" id="profile-faculty"></p>
        <p class="profile-campus" id="profile-campus"></p>
      </div>

      <form class="edit-form" id="edit-form" hidden>
        <div class="edit-field">
          <label for="input-name">名前</label>
          <input type="text" id="input-name" maxlength="30" autocomplete="name">
          <p class="error" id="name-error" role="alert"></p>
        </div>

        <div class="edit-field">
          <label for="input-faculty">学部</label>
          <input type="text" id="input-faculty" maxlength="30" autocomplete="off">
          <p class="error" id="faculty-error" role="alert"></p>
        </div>

        <div class="edit-field">
          <label for="input-campus">キャンパス</label>
          <select id="input-campus">
            <option value="">選択してください</option>
            <option value="吉田">吉田</option>
            <option value="常盤">常盤</option>
            <option value="小串">小串</option>
          </select>
          <p class="error" id="campus-error" role="alert"></p>
        </div>

        <div class="edit-actions">
          <button type="submit" id="save">保存する</button>
          <button type="button" class="secondary" id="cancel">やめる</button>
        </div>
      </form>
    </div>

    <div class="menu">
      <button type="button" class="menu-item" data-key="listings" aria-expanded="false" aria-controls="panel-listings">
        出品中の商品<span class="badge" id="listings-badge"></span>
      </button>
      <div class="menu-panel" id="panel-listings" hidden></div>

      <button type="button" class="menu-item" data-key="applications">
        申込中の商品<span class="badge" id="applications-badge"></span>
      </button>

      <button type="button" class="menu-item" data-key="deals" aria-expanded="false" aria-controls="panel-deals">
        取引中
      </button>
      <div class="menu-panel" id="panel-deals" hidden>取引中の一覧を表示する機能は未実装です。</div>

      <button type="button" class="menu-item" data-key="history" aria-expanded="false" aria-controls="panel-history">
        取引履歴
      </button>
      <div class="menu-panel" id="panel-history" hidden>取引履歴を表示する機能は未実装です。</div>

      <button type="button" class="menu-item" data-key="settings" aria-expanded="false" aria-controls="panel-settings">
        設定
      </button>
      <div class="menu-panel" id="panel-settings" hidden>設定画面は未実装です。</div>
    </div>

    <p class="note" id="note" hidden></p>
  </main>

  <script>
    (function () {
      "use strict";

      var PROFILE_KEY = "profile";
      var LISTINGS_KEY = "listings";
      var MAX_PHOTO_BYTES = 5 * 1024 * 1024;

      // プロフィールAPIはまだ繋いでいないため、内容はこの端末のブラウザにだけ残る。
      var DEFAULT_PROFILE = { name: "名前", faculty: "学部", campus: "キャンパス", avatar: "" };

      var back = document.getElementById("back");
      var avatar = document.getElementById("avatar");
      var avatarInput = document.getElementById("avatar-input");
      var profileView = document.getElementById("profile-view");
      var editForm = document.getElementById("edit-form");
      var edit = document.getElementById("edit");
      var cancel = document.getElementById("cancel");
      var inputName = document.getElementById("input-name");
      var inputFaculty = document.getElementById("input-faculty");
      var inputCampus = document.getElementById("input-campus");
      var note = document.getElementById("note");

      var profile = loadProfile();
      var pendingAvatar = "";

      function loadProfile() {
        try {
          var saved = JSON.parse(window.localStorage.getItem(PROFILE_KEY) || "{}");
          return Object.assign({}, DEFAULT_PROFILE, saved);
        } catch (error) {
          return Object.assign({}, DEFAULT_PROFILE);
        }
      }

      function saveProfile(values) {
        try {
          window.localStorage.setItem(PROFILE_KEY, JSON.stringify(values));
          return true;
        } catch (error) {
          return false;
        }
      }

      function loadListings() {
        try {
          return JSON.parse(window.localStorage.getItem(LISTINGS_KEY) || "[]");
        } catch (error) {
          return [];
        }
      }

      back.addEventListener("click", function () {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = "home.html";
      });

      function renderAvatar(source) {
        avatar.textContent = "";
        if (source) {
          var image = document.createElement("img");
          image.src = source;
          image.alt = "";
          avatar.appendChild(image);
        }
      }

      function renderProfile() {
        document.getElementById("profile-name").textContent = profile.name;
        document.getElementById("profile-faculty").textContent = profile.faculty;
        document.getElementById("profile-campus").textContent = profile.campus;
        renderAvatar(profile.avatar);
      }

      function setEditing(editing) {
        profileView.hidden = editing;
        editForm.hidden = !editing;
        avatar.classList.toggle("editable", editing);

        if (editing) {
          pendingAvatar = profile.avatar;
          inputName.value = profile.name === DEFAULT_PROFILE.name ? "" : profile.name;
          inputFaculty.value = profile.faculty === DEFAULT_PROFILE.faculty ? "" : profile.faculty;
          // 保存済みの値が選択肢に無い場合に備える。
          inputCampus.value = profile.campus;
          if (inputCampus.value !== profile.campus) inputCampus.value = "";
          inputName.focus();
        }
      }

      avatar.addEventListener("click", function () {
        if (editForm.hidden) return;
        avatarInput.click();
      });

      avatarInput.addEventListener("change", function () {
        var file = avatarInput.files && avatarInput.files[0];
        if (!file) return;

        if (file.size > MAX_PHOTO_BYTES) {
          showNote("画像は5MB以内のファイルを選んでください");
          avatarInput.value = "";
          return;
        }

        var reader = new FileReader();
        reader.onload = function () {
          pendingAvatar = String(reader.result);
          renderAvatar(pendingAvatar);
        };
        reader.onerror = function () {
          showNote("画像を読み込めませんでした");
        };
        reader.readAsDataURL(file);
      });

      function setError(input, output, text) {
        output.textContent = text;
        input.classList.toggle("invalid", Boolean(text));
        return !text;
      }

      function validateName() {
        return setError(inputName, document.getElementById("name-error"),
          inputName.value.trim() ? "" : "名前を入力してください");
      }

      function validateFaculty() {
        return setError(inputFaculty, document.getElementById("faculty-error"),
          inputFaculty.value.trim() ? "" : "学部を入力してください");
      }

      function validateCampus() {
        return setError(inputCampus, document.getElementById("campus-error"),
          inputCampus.value ? "" : "キャンパスを選択してください");
      }

      function showNote(text) {
        note.textContent = text;
        note.hidden = !text;
      }

      edit.addEventListener("click", function () {
        showNote("");
        setEditing(true);
      });

      cancel.addEventListener("click", function () {
        pendingAvatar = "";
        avatarInput.value = "";
        renderAvatar(profile.avatar);
        setEditing(false);
        showNote("");
      });

      editForm.addEventListener("submit", function (event) {
        event.preventDefault();

        var checks = [validateName(), validateFaculty(), validateCampus()];
        var fields = [inputName, inputFaculty, inputCampus];
        var firstNg = checks.indexOf(false);
        if (firstNg !== -1) {
          fields[firstNg].focus();
          return;
        }

        profile = {
          name: inputName.value.trim(),
          faculty: inputFaculty.value.trim(),
          campus: inputCampus.value,
          avatar: pendingAvatar
        };

        var stored = saveProfile(profile);
        renderProfile();
        setEditing(false);
        showNote(stored
          ? "プロフィールを保存しました。サーバーへの反映は未実装のため、この端末にだけ残ります。"
          : "画面には反映しましたが、保存できませんでした。");
      });

      /* メニュー */
      function renderListings() {
        var panel = document.getElementById("panel-listings");
        var listings = loadListings();
        panel.textContent = "";

        document.getElementById("listings-badge").textContent =
          listings.length ? "（" + listings.length + "）" : "";

        if (listings.length === 0) {
          panel.textContent = "出品中の商品はありません。出品画面から登録できます。";
          return;
        }

        listings.slice().reverse().forEach(function (listing) {
          var row = document.createElement("div");
          row.className = "listing";

          var thumb = document.createElement("div");
          thumb.className = "thumb";
          if (listing.photo) {
            var image = document.createElement("img");
            image.src = listing.photo;
            image.alt = "";
            thumb.appendChild(image);
          }

          var body = document.createElement("div");
          var title = document.createElement("div");
          title.textContent = listing.name;
          var meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = [listing.category, listing.condition, listing.place]
            .filter(Boolean).join("　");

          body.appendChild(title);
          body.appendChild(meta);
          row.appendChild(thumb);
          row.appendChild(body);
          panel.appendChild(row);
        });
      }

      function renderApplicationsBadge() {
        var applications = [];
        try {
          applications = JSON.parse(window.localStorage.getItem("applications") || "[]");
        } catch (error) {
          applications = [];
        }
        document.getElementById("applications-badge").textContent =
          applications.length ? "（" + applications.length + "）" : "";
      }

      Array.prototype.forEach.call(document.querySelectorAll(".menu-item"), function (item) {
        item.addEventListener("click", function () {
          if (item.dataset.key === "applications") {
            window.location.href = "applications.html";
            return;
          }

          var panel = document.getElementById(item.getAttribute("aria-controls"));
          var open = item.getAttribute("aria-expanded") === "true";
          item.setAttribute("aria-expanded", String(!open));
          panel.hidden = open;

          if (!open && item.dataset.key === "listings") {
            renderListings();
          }
        });
      });

      renderProfile();
      renderListings();
      renderApplicationsBadge();
      setEditing(false);
    })();
  </script>
</body>
</html>
