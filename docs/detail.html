<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUマーケット｜商品詳細</title>
  <style>
    :root {
      --fill: #d9d9d9;
      --fill-hover: #cccccc;
      --text: #1a1a1a;
      --muted: #767676;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic",
        "Noto Sans JP", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100%;
      padding: 20px 20px 48px;
    }

    /* ヘッダー */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .header-button {
      padding: 6px 2px;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }

    .header-button:hover {
      text-decoration: underline;
    }

    .header-button[hidden] {
      display: none;
    }

    .photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--fill);
    }

    .description {
      margin-top: 26px;
    }

    .description h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .description-body {
      margin: 12px 0 0;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .description-body[hidden],
    .description-input[hidden] {
      display: none;
    }

    .description-input {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 0;
      background: #f4f4f4;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.7;
      resize: vertical;
    }

    .description-input:focus {
      outline: none;
      border-color: #8a8a8a;
    }

    .specs {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .spec {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 38px;
      padding: 8px 12px;
      background: var(--fill);
      font-size: 12px;
    }

    .spec .label {
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .spec .value {
      text-align: right;
    }

    .spec .value[hidden],
    .spec select[hidden] {
      display: none;
    }

    .spec select {
      max-width: 60%;
      padding: 4px 6px;
      border: 1px solid #8a8a8a;
      border-radius: 0;
      background: #ffffff;
      font-family: inherit;
      font-size: 12px;
      color: var(--text);
    }

    .actions {
      margin-top: 36px;
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .button {
      width: 180px;
      height: 52px;
      border: none;
      border-radius: 0;
      background: var(--fill);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .button:hover {
      background: var(--fill-hover);
    }

    .button:disabled {
      color: var(--muted);
      cursor: default;
    }

    .button.secondary {
      width: 120px;
      background: #f0f0f0;
    }

    .button.secondary:hover {
      background: #e6e6e6;
    }

    .button[hidden] {
      display: none;
    }

    .note {
      margin: 12px 0 0;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
      text-align: center;
    }

    .note[hidden] {
      display: none;
    }

    .missing {
      margin: 0;
      font-size: 13px;
      line-height: 1.8;
    }

    .missing a {
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="screen" id="screen">
    <div class="header">
      <button type="button" class="header-button" id="back">← 戻る</button>
      <button type="button" class="header-button" id="edit">編集</button>
    </div>

    <div class="photo" id="photo" role="img" aria-label="商品画像"></div>

    <section class="description">
      <h1>商品説明</h1>
      <p class="description-body" id="description"></p>
      <textarea class="description-input" id="description-input" rows="3" aria-label="商品説明" hidden></textarea>
    </section>

    <div class="specs" id="specs">
      <div class="spec" data-key="category">
        <span class="label" id="label-category">カテゴリー</span>
        <span class="value" id="value-category"></span>
      </div>
      <div class="spec" data-key="condition">
        <span class="label" id="label-condition">商品の状態</span>
        <span class="value" id="value-condition"></span>
      </div>
      <div class="spec" data-key="period">
        <span class="label" id="label-period">受け渡し可能期間</span>
        <span class="value" id="value-period"></span>
      </div>
      <div class="spec" data-key="campus">
        <span class="label" id="label-campus">キャンパス</span>
        <span class="value" id="value-campus"></span>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="button" id="apply">申し込む</button>
      <button type="button" class="button" id="save" hidden>保存する</button>
      <button type="button" class="button secondary" id="cancel" hidden>やめる</button>
    </div>
    <p class="note" id="note" hidden></p>
  </main>

  <script>
    (function () {
      "use strict";

      var OPTIONS = {
        category: ["家具", "家電", "教科書", "その他"],
        condition: ["未使用に近い", "目立った傷なし", "やや傷や汚れあり", "傷や汚れあり", "書き込みあり"],
        period: ["今週中", "今月中", "相談可"],
        campus: ["吉田", "常盤", "小串"]
      };

      var STORAGE_KEY = "product-edits";

      // 商品APIはまだ繋いでいないため、ここをサーバーからの取得に差し替える。
      var PRODUCTS = [
        { id: 1, name: "木製ローテーブル", category: "家具", condition: "目立った傷なし", period: "今週中", campus: "吉田", description: "組み立て済み\n使用期間　1年" },
        { id: 2, name: "一人暮らし用 冷蔵庫", category: "家電", condition: "やや傷や汚れあり", period: "相談可", campus: "常盤", description: "動作確認済み\n使用期間　2年" },
        { id: 3, name: "微分積分学 教科書", category: "教科書", condition: "書き込みあり", period: "今週中", campus: "吉田", description: "第3版\n使用期間　1年" },
        { id: 4, name: "電子レンジ", category: "家電", condition: "目立った傷なし", period: "今月中", campus: "吉田", description: "動作確認済み\n使用期間　2年" },
        { id: 5, name: "カラーボックス 3段", category: "家具", condition: "やや傷や汚れあり", period: "今月中", campus: "常盤", description: "背板に小さな傷あり\n使用期間　3年" },
        { id: 6, name: "自転車用 空気入れ", category: "その他", condition: "目立った傷なし", period: "相談可", campus: "小串", description: "動作確認済み\n使用期間　1年" },
        { id: 7, name: "統計学入門 教科書", category: "教科書", condition: "未使用に近い", period: "今月中", campus: "常盤", description: "書き込みなし\n使用期間　半年" },
        { id: 8, name: "デスクライト", category: "その他", condition: "目立った傷なし", period: "今週中", campus: "吉田", description: "動作確認済み\n使用期間　2年" },
        { id: 9, name: "折りたたみ椅子", category: "家具", condition: "やや傷や汚れあり", period: "相談可", campus: "吉田", description: "座面に汚れあり\n使用期間　2年" },
        { id: 10, name: "ケトル", category: "家電", condition: "目立った傷なし", period: "今週中", campus: "小串", description: "動作確認済み\n使用期間　1年" },
        { id: 11, name: "英語リーディング 教科書", category: "教科書", condition: "書き込みあり", period: "今月中", campus: "常盤", description: "蛍光ペンでの書き込みあり\n使用期間　1年" },
        { id: 12, name: "衣類スタンド", category: "家具", condition: "未使用に近い", period: "相談可", campus: "吉田", description: "組み立て説明書あり\n使用期間　半年" }
      ];

      var screenEl = document.getElementById("screen");
      var back = document.getElementById("back");
      var edit = document.getElementById("edit");
      var apply = document.getElementById("apply");
      var save = document.getElementById("save");
      var cancel = document.getElementById("cancel");
      var note = document.getElementById("note");
      var descriptionText = document.getElementById("description");
      var descriptionInput = document.getElementById("description-input");
      var specs = document.getElementById("specs");

      var id = Number(new URLSearchParams(window.location.search).get("id"));
      var product = PRODUCTS.filter(function (item) { return item.id === id; })[0];

      back.addEventListener("click", goBack);

      if (!product) {
        showMissing();
        return;
      }

      // 保存APIはまだ繋いでいないため、編集内容はこの端末のブラウザにだけ残る。
      function loadEdits() {
        try {
          var saved = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "{}");
          return saved[id] || {};
        } catch (error) {
          return {};
        }
      }

      function saveEdits(values) {
        try {
          var saved = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "{}");
          saved[id] = values;
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
          return true;
        } catch (error) {
          return false;
        }
      }

      var current = Object.assign({}, product, loadEdits());

      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = "home.html";
      }

      function showMissing() {
        screenEl.textContent = "";
        var message = document.createElement("p");
        message.className = "missing";
        message.appendChild(document.createTextNode("商品が見つかりませんでした。"));
        message.appendChild(document.createElement("br"));
        var link = document.createElement("a");
        link.href = "search.html";
        link.textContent = "検索画面に戻る";
        message.appendChild(link);
        screenEl.appendChild(message);
      }

      function buildSelects() {
        Array.prototype.forEach.call(specs.querySelectorAll(".spec"), function (spec) {
          var key = spec.dataset.key;
          var select = document.createElement("select");
          select.id = "select-" + key;
          select.hidden = true;
          select.setAttribute("aria-labelledby", "label-" + key);

          OPTIONS[key].forEach(function (value) {
            var option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
          });

          spec.appendChild(select);
        });
      }

      function render() {
        document.title = "YUマーケット｜" + current.name;
        document.getElementById("photo").setAttribute("aria-label", current.name + " の商品画像");
        descriptionText.textContent = current.description;

        Object.keys(OPTIONS).forEach(function (key) {
          document.getElementById("value-" + key).textContent = current[key];
        });
      }

      function setEditing(editing) {
        descriptionText.hidden = editing;
        descriptionInput.hidden = !editing;
        edit.hidden = editing;
        apply.hidden = editing;
        save.hidden = !editing;
        cancel.hidden = !editing;

        Object.keys(OPTIONS).forEach(function (key) {
          document.getElementById("value-" + key).hidden = editing;
          document.getElementById("select-" + key).hidden = !editing;
        });

        if (editing) {
          descriptionInput.value = current.description;
          Object.keys(OPTIONS).forEach(function (key) {
            var select = document.getElementById("select-" + key);
            // 保存済みの値が選択肢に無い場合に備えて、その値を追加してから選択する。
            if (OPTIONS[key].indexOf(current[key]) === -1) {
              var option = document.createElement("option");
              option.value = current[key];
              option.textContent = current[key];
              select.appendChild(option);
            }
            select.value = current[key];
          });
          descriptionInput.focus();
        }
      }

      function showNote(text) {
        note.textContent = text;
        note.hidden = !text;
      }

      edit.addEventListener("click", function () {
        showNote("");
        setEditing(true);
      });

      cancel.addEventListener("click", function () {
        setEditing(false);
        showNote("");
      });

      save.addEventListener("click", function () {
        var values = { description: descriptionInput.value };
        Object.keys(OPTIONS).forEach(function (key) {
          values[key] = document.getElementById("select-" + key).value;
        });

        current = Object.assign({}, current, values);
        var stored = saveEdits(values);

        render();
        setEditing(false);
        showNote(stored
          ? "変更を保存しました。サーバーへの反映は未実装のため、この端末にだけ残ります。"
          : "変更を画面に反映しましたが、保存できませんでした。");
      });

      apply.addEventListener("click", function () {
        window.location.href = "confirm.html?id=" + encodeURIComponent(id);
      });

      buildSelects();
      render();
      setEditing(false);
    })();
  </script>
</body>
</html>
