<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUマーケット｜新規登録</title>
  <style>
    :root {
      --fill: #d9d9d9;
      --fill-hover: #cccccc;
      --text: #1a1a1a;
      --error: #c0392b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic",
        "Noto Sans JP", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      min-height: 100%;
      padding: 56px 24px 40px;
      max-width: 480px;
      margin: 0 auto;
    }

    .brand {
      margin: 0 0 36px;
      text-align: center;
    }

    .brand-name {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.08em;
    }

    .brand-sub {
      margin: 6px 0 0;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #767676;
    }

    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .field input {
      height: 64px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 0;
      background: var(--fill);
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
    }

    .field input:focus {
      outline: none;
      border-color: #8a8a8a;
    }

    .field input.invalid {
      border-color: var(--error);
    }

    .error {
      margin: 0;
      min-height: 16px;
      font-size: 12px;
      line-height: 16px;
      color: var(--error);
    }

    .actions {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .submit {
      width: 130px;
      height: 44px;
      border: none;
      border-radius: 0;
      background: var(--fill);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .submit:hover {
      background: var(--fill-hover);
    }

    .submit:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .login-link {
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
    }

    .login-link:hover {
      text-decoration: underline;
    }

    .done {
      margin: 0;
      min-height: 16px;
      font-size: 12px;
      line-height: 16px;
      color: #1a7f43;
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="brand">
      <p class="brand-name">YUマーケット</p>
      <p class="brand-sub">山口大学</p>
    </header>

    <form class="signup-form" id="signup-form" novalidate>
      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" autocomplete="email" inputmode="email">
        <p class="error" id="email-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="new-password">
        <p class="error" id="password-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="password-confirm">パスワード（確認）</label>
        <input type="password" id="password-confirm" name="password-confirm" autocomplete="new-password">
        <p class="error" id="password-confirm-error" role="alert"></p>
      </div>

      <div class="actions">
        <button type="submit" class="submit">登録する</button>
        <p class="done" id="form-message" role="status"></p>
        <a class="login-link" href="index.html">すでに登録済みの方はこちら</a>
      </div>
    </form>
  </main>

  <script>
    (function () {
      "use strict";

      var form = document.getElementById("signup-form");
      var email = document.getElementById("email");
      var password = document.getElementById("password");
      var confirm = document.getElementById("password-confirm");
      var emailError = document.getElementById("email-error");
      var passwordError = document.getElementById("password-error");
      var confirmError = document.getElementById("password-confirm-error");
      var message = document.getElementById("form-message");

      var EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      function setError(input, output, text) {
        output.textContent = text;
        input.classList.toggle("invalid", Boolean(text));
        return !text;
      }

      function validateEmail() {
        var value = email.value.trim();
        if (!value) {
          return setError(email, emailError, "メールアドレスを入力してください");
        }
        if (!EMAIL_PATTERN.test(value)) {
          return setError(email, emailError, "メールアドレスの形式が正しくありません");
        }
        return setError(email, emailError, "");
      }

      function validatePassword() {
        var value = password.value;
        if (!value) {
          return setError(password, passwordError, "パスワードを入力してください");
        }
        if (value.length < 8) {
          return setError(password, passwordError, "パスワードは8文字以上で入力してください");
        }
        return setError(password, passwordError, "");
      }

      function validateConfirm() {
        var value = confirm.value;
        if (!value) {
          return setError(confirm, confirmError, "確認用パスワードを入力してください");
        }
        if (value !== password.value) {
          return setError(confirm, confirmError, "パスワードが一致しません");
        }
        return setError(confirm, confirmError, "");
      }

      function watch(input, validate) {
        input.addEventListener("blur", validate);
        input.addEventListener("input", function () {
          message.textContent = "";
          if (input.classList.contains("invalid")) validate();
        });
      }

      watch(email, validateEmail);
      watch(password, validatePassword);
      watch(confirm, validateConfirm);

      password.addEventListener("input", function () {
        if (confirm.classList.contains("invalid")) validateConfirm();
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        message.textContent = "";

        var checks = [validateEmail(), validatePassword(), validateConfirm()];
        var inputs = [email, password, confirm];
        var firstNg = checks.indexOf(false);
        if (firstNg !== -1) {
          inputs[firstNg].focus();
          return;
        }

        // 登録サーバーがまだ無いため、この端末にだけ保存している。
        // 本番では必ずサーバー側に登録し、パスワードを端末に保存しないこと。
        var accounts = [];
        try {
          accounts = JSON.parse(window.localStorage.getItem("accounts") || "[]");
        } catch (error) {
          accounts = [];
        }

        var address = email.value.trim();
        var duplicated = accounts.some(function (account) {
          return account.email === address;
        });
        if (duplicated) {
          setError(email, emailError, "このメールアドレスは既に登録されています");
          email.focus();
          return;
        }

        accounts.push({ email: address, password: password.value });
        try {
          window.localStorage.setItem("accounts", JSON.stringify(accounts));
          window.localStorage.setItem("session", JSON.stringify({ email: address }));
        } catch (error) {
          message.textContent = "登録内容を保存できませんでした。";
          return;
        }

        message.textContent = "登録しました。ホーム画面に移動します。";
        window.setTimeout(function () {
          window.location.href = "home.html";
        }, 600);
      });
    })();
  </script>
</body>
</html>
